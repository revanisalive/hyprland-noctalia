### MONITORS ###

monitor = DP-3, 2560x1440@165, 0x0, 1

### MY PROGRAMS ###

$terminal = kitty
$filemanager =  exec kitty yazi
$browser = librewolf
$editor = gnome-text-editor
$steam = steam
$discord = vesktop
$audio = pavucontrol
$music = exec kitty rmpc
$missioncenter = missioncenter
$ipc = qs -c noctalia-shell ipc call

--enable-features=UseOzonePlatform --ozone-platform=wayland

### AUTOSTART ###

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprctl setcursor LyraB-cursors 72
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = qs -c noctalia-shell
exec-once = hyprctl setcursor 36

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

### ENVIRONMENT VARIABLES ###

#Cursor#
env = XCURSOR_SIZE, 36
env = XCURSOR_THEME, LyraB-cursors
env = HYPRCURSOR_SIZE, 36
env = HYPRCURSOR_THEME, LyraB-cursors

#Firefox#
env = MOZ_ENABLE_WAYLAND,1

#QT#
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,kvantum

#Toolkit Backend Variables#
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

#XDG Specifications#
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

### LOOK AND FEEL ###

general { 
    gaps_in = 3
    gaps_out = 6

    border_size = 2

    col.active_border = rgb(83A4E7) 
    col.inactive_border = rgb(1E1E2E)
    resize_on_border = false 

    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1
    inactive_opacity = 1

    border_part_of_window = false

    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
	animation = workspaces, 1, 5, default
	animation = windows, 1, 5, default, slide
	animation = fade, 0
}

dwindle {
    preserve_split = true
}

master {
    
}

misc { 
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
    disable_splash_rendering = true
    vrr = 0
}

### INPUT ###

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    force_no_accel = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

### KEYBINDS ###

$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $editor
bind = $mainMod, D, exec, $filemanager
bind = $mainMod, S, exec, $steam  
bind = $mainMod, V, exec, $discord
bind = $mainMod, A, exec, $audio
bind = $mainMod, R, exec, $music
bind = CTRL ALT, DELETE, exec, $missioncenter
bind = $mainMod, F, fullscreen 
bind = $mainMod, Q, killactive 
bind = $mainMod, M, exit
bind = $mainMod, B, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit

#Monitor Brightness
bindel = SHIFT CTRL, A, exec, ddcutil setvcp 10 + 10
bindel = SHIFT CTRL, Z, exec, ddcutil setvcp 10 - 10

#Monitor On/Off
bind = $mainMod, O, exec, hyprctl dispatch dpms off
bind = $mainMod, I, exec, hyprctl dispatch dpms on

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window position with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Screen locking
bind = $mainMod, L, exec, 

# wlogout
bind = $mainMod, ESCAPE, exec, 

# Scroll through existing workspaces with mainMod + scroll (or TAB)
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, TAB, workspace, e+1

# Move/resize windows + Mouse
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Screenshot 
# add --cursor flag to include cursor also, --freeze flag to freeze before selection
bind = , F12, exec, grimblast --notify copysave screen 
bind = $mainMod, F12, exec, grimblast --notify copysave active 
bind = SUPER ALT, F12, exec, grimblast --notify copysave area

# Volume and Media Control
bind = SHIFT CTRL, Up, exec, pamixer -i 5
bind = SHIFT CTRL, Down, exec, pamixer -d 5
bind = SHIFT CTRL, Space, exec, mpc toggle 
bind = SHIFT CTRL, Right, exec, mpc next
bind = SHIFT CTRL, Left, exec, mpc prev

# Noctalia Binds
bind = $mainMod, SPACE, exec, $ipc launcher toggle
bind = $mainMod, F1, exec, $ipc controlCenter toggle
bind = $mainMod, F2, exec, $ipc settings toggle
bind = $mainMod, l, exec, $ipc lockScreen lock
bind = $mainMod, ESCAPE, exec, $ipc sessionMenu toggle
bind = $mainMod, F3, exec, $ipc wallpaper toggle
bind = $mainMod, F4, exec, $ipc wallpaper random

### WINDOWS AND WORKSPACES ###
## Use hyprctl clients to look for window class

windowrule = match:class org.pulseaudio.pavucontrol, size 1200 800
windowrule = match:class org.pulseaudio.pavucontrol, float on

windowrule = match:class kitty, size 1200 1200
windowrule = match:class kitty, pseudo on
